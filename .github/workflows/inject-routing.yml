name: Load Velvet model routing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  route:
    if: ${{ !contains(github.event.head_commit.message, '[routing-injected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject routing override
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./model-routing-override.js"></script>'
          if tag not in s:
              anchor='<script src="./ai.js"></script>'
              if anchor in s:
                  s=s.replace(anchor, anchor+tag)
              else:
                  s=s.replace('</body>',tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load model routing override [routing-injected]'
          git push
