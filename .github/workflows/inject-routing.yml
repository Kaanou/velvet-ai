name: Load Velvet model routing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  route:
    if: ${{ !contains(github.event.head_commit.message, '[routing-injected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject routing override
        run: |
          echo "Model routing is wired once in index.html; no legacy injection needed."
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load model routing override [routing-injected]'
          git push
