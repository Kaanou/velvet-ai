<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Velvet AI — Compagnes IA</title><meta name="description" content="Compagnes IA fictives majeures — conversations en français."><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:Inter,system-ui,-apple-system,sans-serif}main{max-width:1100px;margin:auto;padding:28px 18px}.hero{padding:55px 0 30px}.eyebrow{color:#ef4444;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px}h1{font-size:clamp(38px,8vw,72px);margin:10px 0}.sub{color:#aaa;font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#111;border:1px solid #252525;border-radius:22px;padding:20px;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#444}.avatar{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#333,#171717);font-size:30px;margin-bottom:18px}.tag{display:inline-block;color:#bbb;background:#1b1b1b;border-radius:99px;padding:5px 9px;font-size:12px;margin:3px 3px 3px 0}.chat{display:none}.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}.back{background:#191919;color:#fff;border:0;border-radius:12px;padding:10px 14px}.messages{height:55vh;overflow:auto;background:#0d0d0d;border:1px solid #222;border-radius:20px;padding:18px}.msg{max-width:78%;padding:12px 15px;border-radius:17px;margin:8px 0;line-height:1.45}.ai{background:#191919}.me{background:#ef4444;margin-left:auto}.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1;background:#111;color:#fff;border:1px solid #292929;border-radius:15px;padding:15px}.send{background:#ef4444;color:#fff;border:0;border-radius:15px;padding:0 20px;font-weight:700}@media(max-width:600px){main{padding:18px}.hero{padding-top:30px}.messages{height:60vh}}</style></head><body><main><section id="home"><div class="hero"><div class="eyebrow">Velvet AI · 18+</div><h1>Choisis quelqu’un.<br>Commence à parler.</h1><p class="sub">Des compagnes IA fictives, majeures et avec des personnalités différentes. Tout est en français.</p></div><div class="grid" id="girls"></div></section><section id="chat" class="chat"><div class="top"><button class="back" onclick="goHome()">← Retour</button><div><b id="name"></b><div id="bio" class="sub" style="font-size:13px"></div></div></div><div id="messages" class="messages"></div><div class="composer"><input id="input" placeholder="Écris un message…" autocomplete="off"><button class="send" onclick="send()">Envoyer</button></div></section></main><script>const girls=[['Maya','Douce · romantique · attentive','M','Tu viens de choisir Maya. Elle est calme, chaleureuse et adore les conversations profondes.'],['Luna','Mystérieuse · sarcastique · joueuse','L','Luna te regarde avec un sourire amusé. « Alors… qu’est-ce qui t’amène ici ? »'],['Sofia','Confiante · ambitieuse · directe','S','Sofia croise les bras. « Bon. Pas de blabla inutile. Dis-moi ce que tu veux vraiment. »'],['Emma','Drôle · spontanée · chaleureuse','E','Emma sourit. « Enfin quelqu’un avec qui parler ! Allez, raconte-moi ta journée. »'],['Naomi','Intellectuelle · calme · profonde','N','Naomi te répond tranquillement. « J’aime les conversations qui vont quelque part. On commence par quoi ? »'],['Jade','Énergique · taquine · imprévisible','J','Jade sourit. « Je sens que cette conversation risque de devenir intéressante. »']];let current=null;let history={};const el=id=>document.getElementById(id);function render(){el('girls').innerHTML=girls.map((g,i)=>`<article class="card" onclick="openGirl(${i})"><div class="avatar">${g[2]}</div><h2>${g[0]}</h2><p class="sub">${g[1]}</p><span class="tag">18+</span><span class="tag">IA</span></article>`).join('')}function openGirl(i){current=i;let g=girls[i];el('home').style.display='none';el('chat').style.display='block';el('name').textContent=g[0]+' · 18+';el('bio').textContent=g[1];history[i]=history[i]||[{role:'ai',text:g[3]}];renderMessages()}function renderMessages(){el('messages').innerHTML=history[current].map(m=>`<div class="msg ${m.role==='me'?'me':'ai'}">${escapeHtml(m.text)}</div>`).join('');el('messages').scrollTop=el('messages').scrollHeight}function send(){let x=el('input').value.trim();if(!x)return;history[current].push({role:'me',text:x});el('input').value='';let replies=['Intéressant. Continue…','Je vois. Et qu’est-ce que tu ressens vraiment ?','J’aime bien ta façon de parler. Raconte-moi davantage.','Ça, je ne m’y attendais pas.','D’accord. Mais maintenant, sois honnête avec moi.'];setTimeout(()=>{history[current].push({role:'ai',text:replies[Math.floor(Math.random()*replies.length)]});localStorage.velvetHistory=JSON.stringify(history);renderMessages()},350);renderMessages()}function goHome(){el('chat').style.display='none';el('home').style.display='block'}function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}render();try{history=JSON.parse(localStorage.velvetHistory||'{}')}catch(e){history={}}</script></body></html>
