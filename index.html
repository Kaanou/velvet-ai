<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Velvet AI — Compagnes virtuelles</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#080808;color:#f7f4f4;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;overscroll-behavior:none}body{overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1180px;margin:auto;padding:16px 16px calc(30px + env(safe-area-inset-bottom));min-height:100dvh}
.nav{height:48px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:9px;align-items:center;font-weight:800}
.brandmark{width:34px;height:34px;border-radius:11px;background:#ef4444;color:#090909;display:grid;place-items:center;font-weight:900;font-size:18px}
.status{font-size:11px;color:#777}
.hero{text-align:center;padding:36px 0 24px}
.eyebrow{font-size:11px;color:#ef4444;text-transform:uppercase;letter-spacing:.16em;font-weight:800}
.hero h1{font-size:clamp(36px,8vw,64px);line-height:.94;letter-spacing:-.065em;margin:12px 0}
.hero p{max-width:650px;margin:14px auto;color:#a7a1a3;line-height:1.55}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:16px 0 12px}
.sectionhead h2{font-size:18px;margin:0}
.sectionhead span{font-size:11px;color:#666}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{position:relative;overflow:hidden;height:360px;border:1px solid #292426;border-radius:22px;background:#111;box-shadow:0 12px 40px #0009}
.photo{position:absolute;inset:0;background-size:cover;background-position:center top;background-color:#171516}
.photo:after{content:"";position:absolute;inset:15% 0 0;background:linear-gradient(transparent 10%,#080808 92%);z-index:1}
.info{position:absolute;z-index:2;left:14px;right:14px;bottom:14px}
.name{font-size:22px;font-weight:800}
.age{font-size:12px;color:#aaa;margin-left:6px;font-weight:500}
.bio{font-size:12px;color:#c2bcbe;margin:4px 0 8px}
.chips span{display:inline-block;padding:4px 7px;border-radius:99px;background:#fff1;border:1px solid #fff2;color:#d7d1d2;font-size:10px;margin:2px}
.enter{width:100%;margin-top:8px;border:0;border-radius:12px;padding:11px;background:#f0eeee;color:#111;font-weight:800}
.notice{text-align:center;color:#666;font-size:11px;line-height:1.5;margin:16px auto;max-width:700px}
.chat{display:none;max-width:850px;margin:auto;height:calc(100dvh - 32px);position:relative}
.chathead{height:58px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.back,.more{border:1px solid #292426;background:#121112;color:#ddd;border-radius:12px;padding:9px 12px}
.mini{width:42px;height:42px;border-radius:50%;background-size:cover;background-position:center top;background-color:#171516;flex:0 0 auto}
.chatname{font-weight:800}.online{font-size:10px;color:#777;margin-top:2px}
.messages{position:absolute;left:0;right:0;top:58px;bottom:124px;overflow-y:auto;padding:8px 2px 28px;-webkit-overflow-scrolling:touch}
.row{display:flex;margin:10px 0}.row.me{justify-content:flex-end}
.bubble{max-width:min(78%,570px);padding:12px 15px;border-radius:18px;background:#171516;border:1px solid #252123;line-height:1.48;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.row.me .bubble{background:#ef4444;border-color:#ef4444;color:white;border-bottom-right-radius:6px}
.row.ai .bubble{border-bottom-left-radius:6px}
.typing{display:flex;gap:4px;align-items:center;padding:14px 16px}
.dot{width:5px;height:5px;border-radius:50%;background:#777;animation:d 1s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes d{50%{opacity:.2;transform:translateY(-2px)}}
.composer{position:fixed;z-index:50;left:50%;transform:translateX(-50%);width:min(850px,calc(100% - 24px));bottom:calc(8px + env(safe-area-inset-bottom));padding:8px 0;background:linear-gradient(transparent,#080808 22%);display:flex;gap:7px;align-items:center}
.composer input{height:52px;min-width:0;flex:1;border:1px solid #302b2d;background:#121112;color:#fff;border-radius:16px;padding:0 15px;outline:none;font-size:16px}
.send{height:52px;border:0;background:#ef4444;color:white;border-radius:16px;padding:0 17px;font-weight:800}
.tools{position:fixed;z-index:49;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom));width:min(850px,calc(100% - 24px));display:flex;gap:7px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;border:1px solid #292426;background:#121112;color:#aaa;border-radius:99px;padding:8px 11px;font-size:11px}
.photoResult,.videoResult{max-width:100%;max-height:55vh;border-radius:16px;display:block;margin-top:3px;background:#0e0e0e}
.photoCaption{font-size:11px;color:#777;margin-top:7px}
.settings{display:none;position:absolute;z-index:60;right:0;top:55px;background:#141214;border:1px solid #292426;border-radius:15px;padding:12px;width:min(280px,90vw);max-height:75vh;overflow-y:auto;box-shadow:0 20px 50px #000}
.settings button{display:block;width:100%;margin:5px 0;border:1px solid #383235;background:#1b191a;color:#ddd;border-radius:10px;padding:9px;font-size:12px}
.footer{text-align:center;color:#555;font-size:10px;margin-top:20px}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.card{height:320px}}
@media(max-width:500px){.wrap{padding-left:12px;padding-right:12px}.status{display:none}.hero h1{font-size:42px}.grid{grid-template-columns:1fr}.card{height:380px}.chat{height:100dvh;width:100%}.messages{bottom:126px}.bubble{max-width:88%}.composer{width:calc(100% - 20px)}.tools{width:calc(100% - 20px)}}
</style>
</head>
<body>
<div class="wrap">
<header class="nav"><div class="brand"><div class="brandmark">V</div><span>Velvet AI</span></div><div class="status">● 30 compagnes · 18+</div></header>
<section id="home">
<div class="hero"><div class="eyebrow">Compagnes virtuelles · 18+</div><h1>Une présence.<br>Une personnalité.</h1><p>30 compagnes majeures. Chat, photos et vidéos.</p></div>
<div class="sectionhead"><h2>Qui veux-tu rencontrer ?</h2><span id="count">30</span></div>
<div class="grid" id="girls"></div>
<div class="notice">Personnages fictifs majeurs. Conversations locales.</div>
</section>
<section id="chat" class="chat">
<div class="chathead">
<button class="back" onclick="goHome()">←</button>
<div class="mini" id="mini"></div>
<div><div class="chatname" id="chatname"></div><div class="online">● disponible</div></div>
<button class="more" style="margin-left:auto" onclick="toggleSettings()">•••</button>
</div>
<div class="settings" id="settings">
<button onclick="generatePhoto()">📷 Photo</button>
<button onclick="generateVideo()">🎥 Vidéo</button>
<button onclick="clearChat()">Effacer conversation</button>
<button onclick="goHome()">Changer de compagne</button>
</div>
<div class="messages" id="messages"></div>
<div class="tools">
<button class="tool" onclick="quick('Comment tu vas ?')">Comment tu vas ?</button>
<button class="tool" onclick="quick('Raconte-moi ta journée')">Ta journée ?</button>
<button class="tool" onclick="generatePhoto()">📷 Photo</button>
<button class="tool" onclick="generateVideo()">🎥 Vidéo</button>
</div>
<div class="composer"><input id="input" placeholder="Écris-lui naturellement…" autocomplete="off" enterkeyhint="send"><button class="send" onclick="send()">Envoyer</button></div>
</section>
<div class="footer">Velvet AI · 18+</div>
</div>
<script>
const girls = window.__VELVET_GIRLS || [];
let current=null, history={};
const $=id=>document.getElementById(id);
try{history=JSON.parse(localStorage.getItem('velvet-history')||'{}')}catch(e){history={}}
function save(){try{localStorage.setItem('velvet-history',JSON.stringify(history))}catch(e){}}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&','<':'<','>':'>',"'":'&#39;','"':'"'}[c]))}
function render(){
  const root=$('girls'); if(!root)return;
  if($('count')) $('count').textContent=girls.length+' profils';
  root.innerHTML=girls.map((g,i)=>`<article class="card"><div class="photo" style="background-image:url('${g.photo}')"></div><div class="info"><div class="name">${esc(g.name)}<span class="age">${g.age} ans</span></div><div class="bio">${esc(g.bio)}</div><div class="chips">${(g.tags||[]).map(x=>`<span>${esc(x)}</span>`).join('')}</div><button class="enter" onclick="openGirl(${i})">Faire connaissance</button></div></article>`).join('');
}
function openGirl(i){
  current=i; const g=girls[i];
  $('home').style.display='none'; $('chat').style.display='block';
  $('chatname').textContent=g.name+' · '+g.age+' ans';
  $('mini').style.backgroundImage=`url('${g.photo}')`;
  history[g.id]=history[g.id]||[{role:'ai',text:g.intro}];
  save(); renderMessages(); setTimeout(()=>{try{$('input').focus()}catch(e){}},100);
}
function renderMessages(){
  if(current===null)return; const g=girls[current];
  $('messages').innerHTML=(history[g.id]||[]).map(m=>{
    if(m.image) return `<div class="row ai"><div class="bubble"><img class="photoResult" src="${esc(m.image)}" alt="photo"><div class="photoCaption">Photo</div></div></div>`;
    if(m.video) return `<div class="row ai"><div class="bubble"><video class="videoResult" src="${esc(m.video)}" controls playsinline></video><div class="photoCaption">Vidéo</div></div></div>`;
    return `<div class="row ${m.role==='me'?'me':'ai'}"><div class="bubble">${esc(m.text)}</div></div>`;
  }).join('');
  requestAnimationFrame(()=>{$('messages').scrollTop=$('messages').scrollHeight});
}
function quick(t){$('input').value=t; send()}
function toggleSettings(){const s=$('settings'); s.style.display=s.style.display==='block'?'none':'block'}
function clearChat(){if(current===null)return; delete history[girls[current].id]; save(); openGirl(current); $('settings').style.display='none'}
function addTyping(){removeTyping(); const x=document.createElement('div'); x.className='row ai'; x.id='typing'; x.innerHTML='<div class="bubble typing"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>'; $('messages').appendChild(x); $('messages').scrollTop=$('messages').scrollHeight}
function removeTyping(){const x=$('typing'); if(x)x.remove()}
function send(){
  if(window.__velvetSend) return window.__velvetSend();
  const input=$('input'); const text=input.value.trim();
  if(!text||current===null)return;
  const g=girls[current]; input.value='';
  history[g.id]=history[g.id]||[]; history[g.id].push({role:'me',text}); save(); renderMessages();
  addTyping();
  setTimeout(()=>{removeTyping(); history[g.id].push({role:'ai',text:'Connecte l’IA (bouton 🧠) pour discuter.'}); save(); renderMessages()},400);
}
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault(); send()}});
function goHome(){$('chat').style.display='none'; $('home').style.display='block'; $('settings').style.display='none'; current=null}
function generatePhoto(){ if(window.generatePhoto) window.generatePhoto(); else alert('Connecte l’IA d’abord'); }
function generateVideo(){ if(window.generateVideo) window.generateVideo(); else alert('Connecte l’IA d’abord'); }
render();
</script>
<script src="./girls.js?v=8"></script>
<script src="./ai.js?v=8"></script>
</body>
</html>
